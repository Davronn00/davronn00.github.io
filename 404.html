<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Page Not Found | Davronbek Nurmakhatov</title>
    <meta name="theme-color" content="#0b0f14" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0b0f14;
        --panel: #121922;
        --border: #1f2935;
        --text: #e6edf3;
        --text-dim: #9aa7b5;
        --text-mute: #6b7785;
        --accent: #5eead4;
        --accent-2: #38bdf8;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        background: var(--bg); color: var(--text);
        font-family: "Inter", system-ui, sans-serif;
        min-height: 100vh;
      }
      body {
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        text-align: center; padding: 24px;
        background:
          radial-gradient(800px 400px at 50% 30%, rgba(94,234,212,.06), transparent 60%),
          var(--bg);
      }
      .code {
        font-family: "JetBrains Mono", monospace;
        font-size: clamp(80px, 15vw, 160px);
        font-weight: 800; line-height: 1;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        -webkit-background-clip: text; background-clip: text; color: transparent;
        margin-bottom: 16px;
      }
      h1 {
        font-size: clamp(22px, 3vw, 32px);
        font-weight: 700; margin-bottom: 12px;
      }
      p {
        color: var(--text-dim); font-size: 16px;
        max-width: 44ch; margin-bottom: 32px;
      }
      .btn {
        display: inline-flex; align-items: center; gap: 10px;
        padding: 12px 24px; border-radius: 999px;
        font-weight: 600; font-size: 15px; border: none; cursor: pointer;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #04211c; text-decoration: none;
        transition: transform .15s ease, filter .2s ease;
      }
      .btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
      .btn svg { width: 18px; height: 18px; }
    </style>
  </head>
  <body>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <a class="btn" href="/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to Home
    </a>
  </body>
</html>
